[package]
name = "ttshub"
version = "0.1.0"
edition = "2021"
description = "複数の TTS エンジンを束ねる音声合成ゲートウェイ"

[dependencies]
async-trait = "0.1"
axum = "0.7"
bytes = "1"
form_urlencoded = "1"
futures = "0.3"
indexmap = { version = "2", features = ["serde"] }
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rubato = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1"

[profile.release]
codegen-units = 1
lto = "thin"
