[package]
name = "ttshub-openjtalk"
version = "0.1.0"
edition = "2021"
description = "Open JTalk を HTTP で呼べるようにする、ttshub 用のエンジンのサーバー"

[[bin]]
name = "ttshub-openjtalk"
path = "src/main.rs"

[features]
# ttshub のテストから、偽の open_jtalk でサーバーを立てるためのもの
testing = []

[dependencies]
axum = "0.7"
bytes = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
