# ttshub の設定例。ttshub.yaml にコピーして使う
# 項目の意味は README.md の「設定」を参照

# 全体のデフォルト話者
default_voice: voicevox:ずんだもん

engines:
  # compose の voicevox プロファイルで動かす VOICEVOX
  voicevox:
    plugin: voicevox-compatible
    backends:
      - http://voicevox:50021
    # クレジット表記と規約の URL は、各キャラの規約（/speaker_info）から読み取る。
    # terms_url は規約の URL が読み取れなかったキャラに使う
    terms_url: https://voicevox.hiroshiba.jp/term/
    # 読み取った表記を上書きするときは、キャラ名ごとに書く
    # credits:
    #   ずんだもん: "VOICEVOX:ずんだもん"
    default_voice: ずんだもん/ノーマル
    # VOICEVOX は音声を一括で返すため、長文だと応答開始まで時間がかかる
    response_start_ms: 60000
    # VOICEVOX は 1 件ずつしか合成しない（同時に送るとエンジンの中で順番を待つ）。
    # 1 にしておくと、待ちが ttshub から見え、期限（deadline_ms）に間に合わなければ代わりの声に回せる
    max_concurrency_per_backend: 1

  # compose の ebyroid プロファイルで動かす ebyroid
  # ebyroid:
  #   plugin: ebyroid
  #   # primary_backup: 先頭を優先し、落ちたら次へ / round_robin / least_connections
  #   balance: primary_backup
  #   backends:
  #     - http://ebyroid:4090
  #   max_concurrency_per_backend: 3
  #   # ebyroid は規約を返さないので、クレジット表記はキャラ名ごとに、規約の URL はエンジンに書く
  #   credits:
  #     kiritan: "VOICEROID+ 東北きりたん EX"
  #   terms_url: https://www.ah-soft.com/commercial/voiceroid/private/

  # VOICEVOX 互換のエンジン（AivisSpeech など）は plugin を voicevox-compatible にして足す
  # aivis:
  #   plugin: voicevox-compatible
  #   backends: [http://aivisspeech:10101]

  # Aivis Cloud API（従量課金）。API キーは .env に AIVIS_API_KEY=... と書く
  # 課金のあるエンジンなので、ほかのエンジンが止まっても代わりの声には使われない
  # aivis-cloud:
  #   plugin: aivis-cloud
  #   backends: [https://api.aivis-project.com]
  #   api_key_env: AIVIS_API_KEY
  #   billable: true
  #   models:
  #     - a59cb814-0083-4369-8542-f51a29e72af7   # まお（AivisHub のモデル UUID）

# 同じキャラの別エンジンでの対応。エンジンが止まったときのフォールバック先になる
# equivalents:
#   - [ebyroid:kiritan, voicevox:東北きりたん]

# 別名 → アドレス
aliases:
  zundamon: voicevox:ずんだもん

# プリセット（パラメータ付きの別名）。preset:<名前> で指定する
presets:
  早口ずんだもん: "voicevox:ずんだもん?speed=1.4"

# 利用者ごとの鍵。1 つでも書くと、すべての API に Authorization: Bearer <鍵> が必要になる
# 鍵そのものは .env に書く（例: TTSHUB_KEY_HANAKO=...）
# clients:
#   hanako:
#     key_env: TTSHUB_KEY_HANAKO
#   sillytavern:
#     key_env: TTSHUB_KEY_SILLYTAVERN
#     default_voice: voicevox:四国めたん

# 管理 API（/admin/*）の鍵を入れた環境変数。なければ鍵なしで使える
# admin_key_env: TTSHUB_ADMIN_KEY
