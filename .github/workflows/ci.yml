name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      # 実エンジンは使わない（API のテストは偽の VOICEVOX を、Open JTalk のテストは偽の open_jtalk をテスト内で使う）
      - run: cargo test --locked --workspace

  # master に入ったら、テストが通ったイメージ（ttshub と Open JTalk のサーバー）を GHCR に公開する。
  # arm64 は QEMU だと Rust のビルドが遅いので、アーキテクチャごとにそのアーキテクチャのランナーでビルドし、
  # ダイジェストだけで push しておいて、最後に 1 つのマルチアーキのタグにまとめる
  build-image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    strategy:
      fail-fast: true
      matrix:
        image: [ttshub, ttshub-openjtalk]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
          - image: ttshub
            dockerfile: Dockerfile
          - image: ttshub-openjtalk
            dockerfile: openjtalk/Dockerfile
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/ebycow/${{ matrix.image }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/ebycow/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          # イメージとアーキテクチャごとにキャッシュを分けて、互いに上書きしないようにする
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }},mode=max

      - run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v7
        with:
          # イメージ名を末尾に置く。digest-ttshub-* だと ttshub-openjtalk のものにも当たるため
          name: digest-${{ matrix.arch }}-${{ matrix.image }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build-image
    strategy:
      # イメージごとに独立して公開する（片方の失敗で、もう片方を止めない）
      fail-fast: false
      matrix:
        image: [ttshub, ttshub-openjtalk]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*-${{ matrix.image }}
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/ebycow/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=

      - working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "ghcr.io/ebycow/${IMAGE}@sha256:%s " *)
        env:
          IMAGE: ${{ matrix.image }}

      - run: docker buildx imagetools inspect "ghcr.io/ebycow/${IMAGE}:latest"
        env:
          IMAGE: ${{ matrix.image }}
