name: Audit

on:
  push:
    branches: [master]
    paths: [Cargo.toml, Cargo.lock, .github/workflows/audit.yml]
  pull_request:
    paths: [Cargo.toml, Cargo.lock, .github/workflows/audit.yml]
  # コードを変えなくても新しい勧告は出るので、定期的にも確かめる
  schedule:
    - cron: "0 21 * * 0"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
